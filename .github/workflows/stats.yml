name: Generar tarjeta de estadisticas

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar stats.svg
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=maysalazar16&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&theme=dracula&locale=en&hide_border=false&order=1
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar en la rama stats-output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
